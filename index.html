<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Roller Coaster Creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            font-size: 13px;
            max-width: 350px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        #ui h2 {
            margin-bottom: 15px;
            color: #ff6b9d;
        }
        button {
            background: #ff6b9d;
            color: #fff;
            border: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s;
        }
        button:hover {
            background: #ff4757;
            transform: scale(1.02);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: scale(1);
        }
        #info {
            margin-top: 15px;
            font-size: 11px;
            line-height: 1.8;
            color: #ccc;
        }
        .status {
            color: #4ecca3;
            font-weight: bold;
            margin: 10px 0;
        }
        .controls {
            background: rgba(255, 107, 157, 0.1);
            padding: 10px;
            border-left: 3px solid #ff6b9d;
            margin: 10px 0;
            border-radius: 3px;
        }
        #selectedInfo {
            background: rgba(0, 200, 255, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            border-left: 3px solid #00c8ff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>🎢 Advanced Coaster Creator</h2>
        <div id="mode-display" class="status">Mode: Build</div>
        
        <div class="controls">
            <strong>🎮 Movement:</strong>
            <p>W/A/S/D - Walk around<br>SPACE - Jump<br>Mouse - Look around</p>
        </div>

        <div class="controls">
            <strong>🛠️ Editing:</strong>
            <p>Click track points to select<br>Drag - Move point<br>↑/↓ - Rotate<br>DEL - Remove point</p>
        </div>

        <button id="addPointBtn">📍 Add Track Point</button>
        <button id="clearBtn">🗑️ Clear Track</button>
        <button id="rideBtn" disabled>🚀 Ride Coaster</button>
        <button id="stopRideBtn" disabled>⏹️ Stop Ride</button>

        <div id="selectedInfo" style="display: none;">
            <strong>Selected Point:</strong><br>
            <span id="selectedIndex"></span><br>
            Use ↑↓ to rotate, drag to move
        </div>

        <div id="info">
            <p id="pointCount">Points: 0</p>
            <p id="speedometer" style="display:none;">Speed: 0%</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1b2a);
        scene.fog = new THREE.Fog(0x0d1b2a, 800, 1500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 25, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.shadowMap.mapSize.width = 2048;
        renderer.shadowMap.mapSize.height = 2048;
        document.body.appendChild(renderer.domElement);

        // Lighting - improved
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(150, 200, 100);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 4096;
        directionalLight.shadow.mapSize.height = 4096;
        directionalLight.shadow.camera.far = 800;
        directionalLight.shadow.camera.left = -400;
        directionalLight.shadow.camera.right = 400;
        directionalLight.shadow.camera.top = 400;
        directionalLight.shadow.camera.bottom = -400;
        scene.add(directionalLight);

        // Hemisphere light for better ambient
        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x2d5016, 0.6);
        scene.add(hemiLight);

        // Ground with better material
        const groundGeometry = new THREE.PlaneGeometry(800, 800);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2d5016,
            roughness: 0.9,
            metalness: 0.0,
            map: createGridTexture()
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid texture
        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2d5016';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#1a3010';
            ctx.lineWidth = 1;
            for (let i = 0; i < 256; i += 32) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 256);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(256, i);
                ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.repeat.set(4, 4);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // Player controller
        const player = {
            position: new THREE.Vector3(0, 10, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            direction: new THREE.Euler(0, 0, 0, 'YXZ'),
            speed: 0.3,
            jumpPower: 0.8,
            isJumping: false,
            gravity: -0.015
        };

        // Input handling
        const keys = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedPointIndex = -1;
        let isDraggingPoint = false;
        let isLooking = false;

        document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        document.addEventListener('mousemove', (e) => {
            if (isLooking) {
                player.direction.setFromQuaternion(camera.quaternion);
                player.direction.order = 'YXZ';
                player.direction.rotateY(-e.movementX * 0.003);
                player.direction.rotateX(-e.movementY * 0.003);
                player.direction.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.direction.x));
                camera.quaternion.setFromEuler(player.direction);
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isLooking = true;
                document.pointerLockElement || document.documentElement.requestPointerLock();
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                isLooking = false;
                if (document.pointerLockElement) document.exitPointerLock();
            }
        });

        document.addEventListener('click', () => {
            raycaster.setFromCamera(mouse, camera);
            let selected = false;
            trackPointVisuals.forEach((visual, index) => {
                if (raycaster.ray.distanceToPoint(visual.position) < 10) {
                    selectPoint(index);
                    selected = true;
                }
            });
            if (!selected) deselectPoint();
        });

        // Coaster track
        let trackPoints = [];
        let trackRotations = [];
        let curve = null;
        let trackMesh = null;
        const trackPointVisuals = [];
        const supportBeams = [];
        let isRiding = false;
        let rideProgress = 0;
        let rideSpeed = 0;

        // UI Elements
        const addPointBtn = document.getElementById('addPointBtn');
        const clearBtn = document.getElementById('clearBtn');
        const rideBtn = document.getElementById('rideBtn');
        const stopRideBtn = document.getElementById('stopRideBtn');
        const modeDisplay = document.getElementById('mode-display');
        const pointCountDisplay = document.getElementById('pointCount');
        const selectedInfo = document.getElementById('selectedInfo');
        const speedometer = document.getElementById('speedometer');

        function selectPoint(index) {
            selectedPointIndex = index;
            selectedInfo.style.display = 'block';
            document.getElementById('selectedIndex').textContent = `Point ${index + 1}`;
        }

        function deselectPoint() {
            selectedPointIndex = -1;
            selectedInfo.style.display = 'none';
        }

        function addTrackPoint() {
            const randomX = (Math.random() - 0.5) * 200;
            const randomZ = (Math.random() - 0.5) * 200;
            const height = Math.random() * 120 + 20;
            trackPoints.push(new THREE.Vector3(randomX, height, randomZ));
            trackRotations.push(0);
            updateTrackVisuals();
        }

        function clearTrack() {
            trackPoints = [];
            trackRotations = [];
            trackPointVisuals.forEach(v => scene.remove(v));
            trackPointVisuals.length = 0;
            supportBeams.forEach(b => scene.remove(b));
            supportBeams.length = 0;
            if (trackMesh) scene.remove(trackMesh);
            trackMesh = null;
            curve = null;
            pointCountDisplay.textContent = `Points: 0`;
            rideBtn.disabled = true;
            isRiding = false;
            rideProgress = 0;
            deselectPoint();
        }

        function createRealisticTrack(curve) {
            if (trackMesh && trackMesh.userData.railGroup) {
                scene.remove(trackMesh.userData.railGroup);
            }

            const points = curve.getPoints(Math.max(trackPoints.length * 30, 150));
            const railGroup = new THREE.Group();

            // Main rails (two parallel tracks)
            const railGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const railMaterial = new THREE.MeshStandardMaterial({
                color: 0xc0c0c0,
                metalness: 0.95,
                roughness: 0.1,
                emissive: 0x333333
            });

            // Left rail
            const leftRailPoints = points.map((p, i) => {
                const tangent = curve.getTangent(i / points.length);
                const normal = new THREE.Vector3(0, 1, 0);
                if (Math.abs(tangent.dot(normal)) < 0.99) {
                    normal.crossVectors(tangent, new THREE.Vector3(0, 0, 1)).normalize();
                    normal.crossVectors(tangent, normal).normalize();
                } else {
                    normal.set(1, 0, 0);
                }
                return p.clone().addScaledVector(normal, 8);
            });

            // Right rail
            const rightRailPoints = points.map((p, i) => {
                const tangent = curve.getTangent(i / points.length);
                const normal = new THREE.Vector3(0, 1, 0);
                if (Math.abs(tangent.dot(normal)) < 0.99) {
                    normal.crossVectors(tangent, new THREE.Vector3(0, 0, 1)).normalize();
                    normal.crossVectors(tangent, normal).normalize();
                } else {
                    normal.set(1, 0, 0);
                }
                return p.clone().addScaledVector(normal, -8);
            });

            // Create rails using LatheGeometry for realistic tubing
            points.forEach((p, i) => {
                const railRadius = 2;
                const geometry = new THREE.CylinderGeometry(railRadius, railRadius, 0.5, 8);
                const mesh = new THREE.Mesh(geometry, railMaterial);
                mesh.position.copy(leftRailPoints[i]);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                railGroup.add(mesh);
            });

            points.forEach((p, i) => {
                const railRadius = 2;
                const geometry = new THREE.CylinderGeometry(railRadius, railRadius, 0.5, 8);
                const mesh = new THREE.Mesh(geometry, railMaterial);
                mesh.position.copy(rightRailPoints[i]);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                railGroup.add(mesh);
            });

            // Cross beams
            for (let i = 0; i < points.length; i += 5) {
                const leftPoint = leftRailPoints[i];
                const rightPoint = rightRailPoints[i];
                const distance = leftPoint.distanceTo(rightPoint);
                const midPoint = new THREE.Vector3().addVectors(leftPoint, rightPoint).multiplyScalar(0.5);
